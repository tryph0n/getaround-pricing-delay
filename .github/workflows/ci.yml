name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv lock --check
      - run: uv lock --check --project deploy/hf-api
      - run: uv lock --check --project deploy/hf-dashboard
      - run: uv run python scripts/check_readme_links.py README.md docs deploy/DEPLOYMENT.md

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit --cov=src --cov-report=term-missing

  integration:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make train
      - run: uv run pytest tests/integration -rs --junitxml=integration.xml
      - name: Fail if an integration test was skipped
        run: grep -q 'skipped="0"' integration.xml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: model
          path: models/best_model.joblib
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: model
          path: models
      - run: make stage-api stage-dashboard
      - run: docker build --tag getarround-api .tmp/hf-api
      - run: docker build --tag getarround-dashboard .tmp/hf-dashboard
      - run: docker run --detach --name api --publish 8000:7860 getarround-api
      - run: docker run --detach --name dashboard --publish 8501:7860 getarround-dashboard
      - name: Wait for the API health check
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | grep -q '"model_loaded":true'; then
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Wait for the dashboard health check
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health | grep -q ok; then
              exit 0
            fi
            sleep 2
          done
          docker logs dashboard
          exit 1
